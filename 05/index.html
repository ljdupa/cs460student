<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CS460 Assignment 5</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
  </style>

  <script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@latest/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VertexNormalsHelper } from 'three/addons/helpers/VertexNormalsHelper.js';
    import { AnaglyphEffect } from 'three/addons/effects/AnaglyphEffect.js';

    let renderer, scene, camera, controls, effect, stats;

    const SCENE = {
      anaglyph: false,
      poly: null,
      blender: null,
      blender_helper: null,
      old_material: null,

      change_material() {
        if (!this.blender) return;

        if (!this.old_material) {
          this.old_material = this.blender.material.clone();
          this.blender.material = new THREE.MeshNormalMaterial();
        } else {
          this.blender.material = this.old_material.clone();
          this.old_material = null;
        }
      }
    };

    window.onload = () => {
      setupScene();
      const pane = setupUI();

      const loader = new GLTFLoader();

      //
      // PolyCam Mesh
      //
      loader.load("11_18_2025.glb", gltf => {
        const mesh = findMesh(gltf.scene);
        mesh.scale.set(30, 30, 30);
        mesh.position.set(-40, 0, 0);
        scene.add(gltf.scene);

        SCENE.poly = mesh;

        const ui = pane.addFolder({ title: "PolyCam Mesh" });
        const params = { wireframe: false };

        ui.addBinding(params, "wireframe").on("change", v => {
          mesh.material.wireframe = v.value;
          mesh.material.needsUpdate = true;
        });

        ui.addButton({ title: "rotate!" }).on("click", () => {
          mesh.rotation.y += Math.PI;
        });
      });

      //
      // Blender Mesh
      //
      loader.load("monster2.glb", gltf => {
        const mesh = findMesh(gltf.scene);
        mesh.scale.set(30, 30, 30);
        mesh.position.set(40, 0, 0);
        scene.add(gltf.scene);

        SCENE.blender = mesh;

        const helper = new VertexNormalsHelper(mesh, 2, 0x0000ff);
        helper.visible = false;
        scene.add(helper);
        SCENE.blender_helper = helper;

        const ui = pane.addFolder({ title: "Blender Mesh" });
        ui.expanded = true;

        ui.addBinding(helper, "visible", { label: "Show normals!" });

        ui.addButton({ title: "Change Material" })
          .on("click", () => SCENE.change_material());

        ui.addButton({ title: "rotate!" })
          .on("click", () => {
            mesh.rotation.y += Math.PI;
            helper.update();
          });
      });

      animate();
    };

    function findMesh(root) {
      let mesh = null;
      root.traverse(child => {
        if (child.isMesh && !mesh) mesh = child;
      });
      return mesh;
    }

    function setupScene() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
      );
      camera.position.set(0, 60, 150);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      effect = new AnaglyphEffect(renderer);
      effect.setSize(window.innerWidth, window.innerHeight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);

      const dir = new THREE.DirectionalLight(0xffffff, 2);
      dir.position.set(5, 40, 30);
      scene.add(dir);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 20, 0);

      stats = new Stats();
      document.body.appendChild(stats.dom);
    }

    function setupUI() {
      const pane = new Pane();

      const sceneui = pane.addFolder({ title: "Scene" });
      sceneui.addBinding(SCENE, "anaglyph");

      const dir = scene.children.find(o => o.isDirectionalLight);
      ["x", "y", "z"].forEach(axis => {
        sceneui.addBinding(dir.position, axis, { min: -100, max: 100 });
      });

      sceneui.addBinding(dir, "intensity", { min: 0, max: 10 });

      sceneui.addBinding(scene.children.find(o => o.isAmbientLight), "color", {
        view: "color"
      });

      return pane;
    }

    //
    // Animation Loop (NO TERNARY)
    //
    function animate() {
      requestAnimationFrame(animate);

      stats.begin();
      controls.update();

      if (SCENE.blender_helper) {
        SCENE.blender_helper.update();
      }

      if (SCENE.anaglyph) {
        effect.render(scene, camera);
      } else {
        renderer.render(scene, camera);
      }

      stats.end();
    }
  </script>
</head>
<body></body>
</html>
