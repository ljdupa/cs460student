<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CS460 Assignment 5</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
  </style>

  <script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@latest/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';
    import { AnaglyphEffect } from 'three/addons/effects/AnaglyphEffect.js';

    let scene, camera, renderer, effect, controls, stats;

    const SCENE = {
      anaglyph: false,
      poly: null,
      blender: null
    };

    window.onload = () => {
      setupScene();
      setupUI();
      loadModel("poly.glb", -20, mesh => SCENE.poly = mesh);
      loadModel("edited.glb", 20, mesh => SCENE.blender = mesh);
      animate();
    };

    function setupScene() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
      );
      camera.position.set(0, 20, 80);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      effect = new AnaglyphEffect(renderer);
      effect.setSize(window.innerWidth, window.innerHeight);

      controls = new OrbitControls(camera, renderer.domElement);

      const amb = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(amb);

      const dir = new THREE.DirectionalLight(0xffffff, 1.2);
      dir.position.set(10, 40, 20);
      scene.add(dir);

      stats = new Stats();
      document.body.appendChild(stats.dom);
    }

    function setupUI() {
      const pane = new Pane();
      const sceneUI = pane.addFolder({ title: "Scene" });

      sceneUI.addBinding(SCENE, "anaglyph", { label: "Anaglyph" });

      const light = scene.children.find(o => o.isDirectionalLight);
      const lightUI = sceneUI.addFolder({ title: "Light" });

      ["x", "y", "z"].forEach(axis =>
        lightUI.addBinding(light.position, axis, {
          min: -100,
          max: 100,
          label: `Light ${axis.toUpperCase()}`
        })
      );

      lightUI.addBinding(light, "intensity", {
        min: 0,
        max: 10,
        label: "Intensity"
      });


      const amb = scene.children.find(o => o.isAmbientLight);
      sceneUI.addBinding(amb, "color", {
        label: "Ambient Color",
        view: "color"
      });
    }

    function loadModel(path, xOffset, done) {
      const loader = new GLTFLoader();
      loader.load(path, gltf => {
        let mesh = null;
        gltf.scene.traverse(o => { if (o.isMesh && !mesh) mesh = o; });

        if (!mesh) return;

        mesh.scale.set(10, 10, 10);
        mesh.position.set(xOffset, 0, 0);
        mesh.quaternion.identity();

        scene.add(gltf.scene);
        done(mesh);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      stats.begin();

      controls.update();

      if (SCENE.anaglyph)
        effect.render(scene, camera);
      else
        renderer.render(scene, camera);

      stats.end();
    }
  </script>
</head>

<body></body>
</html>
