<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CS460 Assignment 5</title>

  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
  </style>

  <script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@latest/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';
    import { AnaglyphEffect } from 'three/addons/effects/AnaglyphEffect.js';

    let scene, camera, renderer, effect, stats, controls;

    window.SCENE = {
      anaglyph: false,
      poly: null,
      blender: null
    };

    window.onload = () => {
      setupScene();
      setupUI();
      loadPoly();
      loadBlender();
      animate();
    };

    function setupScene() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
      camera.position.set(0, 10, 80);

      renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      effect = new AnaglyphEffect(renderer);
      effect.setSize(window.innerWidth, window.innerHeight);

      controls = new OrbitControls(camera, renderer.domElement);

      const amb = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(amb);

      const dir = new THREE.DirectionalLight(0xffffff, 1.2);
      dir.position.set(5, 40, 30);
      scene.add(dir);

      stats = new Stats();
      document.body.appendChild(stats.dom);
    }

    function loadPoly() {
      var loader = new GLTFLoader();
      loader.load('poly.glb', function(gltf) {

        scene.add(gltf.scene);

        var poly = gltf.scenes[0].children[0];
        window.SCENE.poly = poly;

        poly.scale.x = 10;
        poly.scale.y = 10;
        poly.scale.z = 10;

        poly.quaternion.w = 1;
        poly.quaternion.x = 0;
        poly.quaternion.y = 0;
        poly.quaternion.z = 0;

        poly.translateX(5);
      });
    }

    function loadBlender() {
      var loader = new GLTFLoader();
      loader.load('edited.glb', function(gltf) {

        scene.add(gltf.scene);

        var b = gltf.scenes[0].children[0];
        window.SCENE.blender = b;

        b.scale.set(10,10,10);

        b.quaternion.w = 1;
        b.quaternion.x = 0;
        b.quaternion.y = 0;
        b.quaternion.z = 0;

        b.translateX(-5);
      });
    }

    function setupUI() {
      var pane = new Pane();
      var sUI = pane.addFolder({ title:'Scene' });

      sUI.addBinding(window.SCENE, 'anaglyph', { label:'Anaglyph' });

      var dir = scene.children.find(o => o.isDirectionalLight);
      var lightUI = sUI.addFolder({ title:'Light' });

      ['x','y','z'].forEach(axis =>
        lightUI.addBinding(dir.position, axis, { min:-100, max:100, label:'Light '+axis })
      );
      lightUI.addBinding(dir, 'intensity', { min:0, max:10 });

      var amb = scene.children.find(o => o.isAmbientLight);
      sUI.addBinding(amb, 'color', { label:'Ambient Color', view:'color' });
    }

    function animate() {
      requestAnimationFrame(animate);
      stats.begin();

      controls.update();

      if (window.SCENE.anaglyph)
        effect.render(scene, camera);
      else
        renderer.render(scene, camera);

      stats.end();
    }
  </script>
</head>
<body></body>
</html>
