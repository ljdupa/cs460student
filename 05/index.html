<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CS460 Assignment 5</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
  </style>

  <!-- Stats.js -->
  <script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>

  <!-- Three.js Import Map -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@latest/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VertexNormalsHelper } from 'three/addons/helpers/VertexNormalsHelper.js';
    import { AnaglyphEffect } from 'three/addons/effects/AnaglyphEffect.js';

    let renderer, scene, camera, controls, effect, stats;

    //
    // GLOBAL SETTINGS FOR TWEAKPANE
    //
    window['SCENE'] = {
      anaglyph: false,

      poly: null,
      blender: null,
      blender_helper: null,
      blender_old_material: null,

      change_material: function () {
        if (!window.SCENE.blender) return;

        if (!window.SCENE.blender_old_material) {
          window.SCENE.blender_old_material =
            window.SCENE.blender.material.clone();

          window.SCENE.blender.material =
            new THREE.MeshNormalMaterial();
        } else {
          window.SCENE.blender.material =
            window.SCENE.blender_old_material.clone();

          window.SCENE.blender_old_material = null;
        }
      }
    };

    window.onload = function () {

      // ----------------------------
      // SCENE
      // ----------------------------
      scene = new THREE.Scene();

      // ----------------------------
      // CAMERA
      // ----------------------------
      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
      );
      camera.position.set(0, 60, 150);
      camera.lookAt(0, 20, 0);

      // ----------------------------
      // RENDERER
      // ----------------------------
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      effect = new AnaglyphEffect(renderer);
      effect.setSize(window.innerWidth, window.innerHeight);

      // ----------------------------
      // LIGHTS
      // ----------------------------
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);

      const dir = new THREE.DirectionalLight(0xffffff, 2.0);
      dir.position.set(5, 40, 30);
      scene.add(dir);

      // ----------------------------
      // ORBIT CONTROLS
      // ----------------------------
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 20, 0);
      controls.update();

      // ----------------------------
      // STATS.JS
      // ----------------------------
      stats = new Stats();
      stats.showPanel(0);
      document.body.appendChild(stats.dom);

      // ----------------------------
      // TWEAKPANE UI ROOT
      // ----------------------------
      const pane = new Pane();

      //
      // SCENE PANEL
      //
      const sceneui = pane.addFolder({ title: 'Scene' });

      sceneui.addBinding(window['SCENE'], 'anaglyph', { label: 'anaglyph' });
      sceneui.addBinding(dir.position, 'x', { min: -100, max: 100, label: 'Light X' });
      sceneui.addBinding(dir.position, 'y', { min: -100, max: 100, label: 'Light Y' });
      sceneui.addBinding(dir.position, 'z', { min: -100, max: 100, label: 'Light Z' });
      sceneui.addBinding(dir, 'intensity', { min: 0, max: 10, label: 'Intensity' });

      sceneui.addBinding(ambient, 'color', {
        view: 'color',
        label: 'Ambient Color',
      });

      // ----------------------------
      // LOAD MODELS
      // ----------------------------
      const loader = new GLTFLoader();

//
// UNEDITED (left) – monster2.glb  (Blender mesh)
//
loader.load("monster2.glb", (gltf) => {

    // PolyCam & Blender exports often contain nested groups — find the actual mesh
    const mesh = gltf.scene.getObjectByProperty("type", "Mesh");

    if (!mesh) {
        console.error("ERROR: No mesh found in monster2.glb");
        return;
    }

    // SCALE + POSITION (adjust as needed)
    mesh.scale.set(30, 30, 30);
    mesh.position.set(-40, 0, 0);

    // Add to scene
    scene.add(gltf.scene);
    window.SCENE.blender = mesh;

    // -----------------------------------------------------------------
    // NORMALS HELPER (VertexNormalsHelper)
    // -----------------------------------------------------------------
    const helper = new VertexNormalsHelper(mesh, 2.0, 0x0000ff);
    helper.visible = false;
    scene.add(helper);
    window.SCENE.blender_helper = helper;

    // -----------------------------------------------------------------
    // UI: Blender Mesh panel
    // -----------------------------------------------------------------
    const blenderui = pane.addFolder({ title: "Blender Mesh" });

    // Show Normals checkbox
    blenderui.addBinding(helper, "visible", { label: "Show normals!" });

    // Change Material button
    blenderui.addButton({ title: "Change Material" })
        .on("click", () => window.SCENE.change_material());

    // Rotate button
    blenderui.addButton({ title: "rotate!" })
        .on("click", () => {
            mesh.rotation.y += Math.PI;
            helper.update(); // keep normals sync'd
        });
});


      //
      // LEFT CAN — ORIGINAL POLYCAM MODEL (11_18_2025.glb)
      //
      loader.load("11_18_2025.glb", (gltf) => {
        const mesh = gltf.scene.getObjectByProperty("type", "Mesh");
        if (!mesh) { console.error("Mesh missing in 11_18_2025.glb"); return; }

        mesh.scale.set(30, 30, 30);
        mesh.position.set(-40, 0, 0);

        scene.add(gltf.scene);
        window.SCENE.blender = mesh;

        // Vertex normals helper
        const helper = new VertexNormalsHelper(mesh, 2.0, 0x0000ff);
        helper.visible = false;
        scene.add(helper);
        window.SCENE.blender_helper = helper;

        // Blender UI
        const blenderui = pane.addFolder({ title: "Blender Mesh" });

        blenderui.addBinding(helper, "visible", { label: "Show normals!" });

        blenderui.addButton({ title: "Change Material" })
          .on("click", () => window.SCENE.change_material());

        blenderui.addButton({ title: "rotate!" })
          .on("click", () => {
            mesh.rotation.y += Math.PI;
            helper.update();
          });
      });

      animate();
    };

    // ----------------------------
    // ANIMATION LOOP
    // ----------------------------
    function animate() {
      requestAnimationFrame(animate);

      stats.begin();
      controls.update();

      if (window.SCENE.blender_helper) {
        window.SCENE.blender_helper.update();
      }

      if (window.SCENE.anaglyph) {
        effect.render(scene, camera);
      } else {
        renderer.render(scene, camera);
      }

      stats.end();
    }
  </script>
</head>
<body></body>
</html>
