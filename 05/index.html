<script type="module">
import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let renderer, scene, camera, controls;

window.onload = function () {

  scene = new THREE.Scene();

  const fov = 75;
  const aspect = window.innerWidth / window.innerHeight;
  const near = 0.1;
  const far = 10000;

  camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
  camera.position.set(0, 80, 160);
  camera.lookAt(0, 20, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // LIGHTS
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);

  const dir = new THREE.DirectionalLight(0xffffff, 2.0);
  dir.position.set(5, 10, 7);
  scene.add(dir);

  // CONTROLS
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 20, 0);
  controls.update();

  // ----------------------------
  // TWEAKPANE UI
  // ----------------------------
  const pane = new Pane();
  const sceneui = pane.addFolder({ title: 'Scene' });

  // Sliders for light
  sceneui.addBinding(dir.position, 'x', { min: -100, max: 100, label: 'Light X' });
  sceneui.addBinding(dir.position, 'y', { min: -100, max: 100, label: 'Light Y' });
  sceneui.addBinding(dir.position, 'z', { min: -100, max: 100, label: 'Light Z' });
  sceneui.addBinding(dir, 'intensity', { min: 0, max: 10, label: 'Intensity' });

  // Ambient color picker
  sceneui.addBinding(ambient, 'color', {
    view: 'color',
    label: 'AmbientLight Color',
  });

  // LOADER
  const loader = new GLTFLoader();

  loader.load("monster2.glb", gltf => {
    const poly = gltf.scene.children[0];
    poly.scale.set(40, 40, 40);
    poly.position.set(0, 0, 0);
    scene.add(gltf.scene);
  });

  loader.load("11_18_2025.glb", gltf => {
    const edited = gltf.scene.children[0];
    edited.scale.set(3, 3, 3);
    edited.position.set(-50, 0, 0);
    scene.add(gltf.scene);
  });

  animate();
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>
