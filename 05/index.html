<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@latest/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let renderer, scene, camera, controls;

    window.onload = function() {

      // SCENE
      scene = new THREE.Scene();

      // CAMERA (closer now)
      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
      );
      camera.position.set(0, 40, 80);   // <- closer to the model
      camera.lookAt(0, 20, 0);

      // RENDERER
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // LIGHTS
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      const dir = new THREE.DirectionalLight(0xffffff, 2.0);
      dir.position.set(5, 10, 7);
      scene.add(dir);

      // ORBIT CONTROLS
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 20, 0);
      controls.update();

      // LOADERS
      const loader = new GLTFLoader();

      // ORIGINAL SCAN — scaled and centered
      loader.load("monster2.glb", function(gltf) {
        const poly = gltf.scenes[0];
        poly.scale.set(30, 30, 30);   // big
        poly.position.set(30, 0, 0);  // right side
        scene.add(poly);
      });

      // EDITED MODEL — same scale
      loader.load("11_18_2025.glb", function(gltf) {
        const edited = gltf.scenes[0];
        edited.scale.set(30, 30, 30);  // big
        edited.position.set(-30, 0, 0); // left side
        scene.add(edited);
      });

      animate();
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</head>
<body></body>
</html>
